<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Cleaner</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Font Awesome for icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="app-container">
      <!-- Sidebar / Header Area -->
      <header>
        <div class="brand">
          <i class="fa-solid fa-broom"></i>
          <h1>Cleaner</h1>
        </div>
        <p class="subtitle">Reclaim your disk space</p>
      </header>

      <!-- Main Content -->
      <main>
        <!-- Select State -->
        <div id="section-select" class="section active">
          <div class="glass-card center-card">
            <div class="icon-circle">
              <i class="fa-solid fa-folder-open"></i>
            </div>
            <h2>Select Workspace</h2>
            <p>
              Choose a folder to scan for <code>node_modules</code> and
              <code>dist</code>
            </p>
            <div class="filters-container">
                <p class="section-label">Targets to Clean:</p>
                <div class="checkbox-group">
                    <label class="custom-checkbox">
                        <input type="checkbox" id="chk-node_modules">
                        <span class="checkmark"></span>
                        <span class="label-text">node_modules</span>
                    </label>
                    <label class="custom-checkbox">
                        <input type="checkbox" id="chk-dist">
                        <span class="checkmark"></span>
                        <span class="label-text">dist</span>
                    </label>
                    <label class="custom-checkbox">
                        <input type="checkbox" id="chk-bin">
                        <span class="checkmark"></span>
                        <span class="label-text">bin</span>
                    </label>
                    <label class="custom-checkbox">
                        <input type="checkbox" id="chk-obj">
                        <span class="checkmark"></span>
                        <span class="label-text">obj</span>
                    </label>
                </div>
            </div>
            <button id="btn-select" class="btn-primary">Browse System</button>
            <p id="selected-path-display" class="path-text"></p>
          </div>
        </div>

        <!-- Scanning State -->
        <div id="section-scanning" class="section hidden">
          <div class="loader-container">
            <div class="spinner"></div>
            <h3>Scanning...</h3>
            <p id="scan-status-text">Searching deep into the void</p>
          </div>
        </div>

        <!-- Results State -->
        <div id="section-results" class="section hidden">
          <div class="stats-bar">
            <div class="stat-item">
              <span class="label">Items Found</span>
              <span class="value" id="stat-count">0</span>
            </div>
            <div class="stat-item">
              <span class="label">Total Size</span>
              <span class="value highlight" id="stat-size">0 MB</span>
            </div>
            <div class="actions">
              <button id="btn-clean" class="btn-danger">
                <i class="fa-solid fa-trash-can"></i> Clean All
              </button>
              <button id="btn-rescan" class="btn-secondary">
                <i class="fa-solid fa-rotate-right"></i>
              </button>
            </div>
          </div>

          <div class="table-container glass-card">
            <table id="results-table">
              <thead>
                <tr>
                  <th>Type</th>
                  <th>Path</th>
                  <th>Size</th>
                </tr>
              </thead>
              <tbody id="results-body">
                <!-- Items go here -->
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>

    <!-- Scripts -->
    <script src="renderer.js"></script>
  </body>
</html>
